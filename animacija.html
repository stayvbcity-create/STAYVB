<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StayVB — kako funkcioniše</title>
<meta name="description" content="StayVB za 45 sekundi: kako jedan sken povezuje ceo grad i zašto svi partneri zarađuju.">
<meta name="theme-color" content="#16222e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#0d151c;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#f4f1ea;-webkit-font-smoothing:antialiased}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;box-shadow:0 30px 90px rgba(0,0,0,.5);cursor:pointer}
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:999px;background:rgba(22,34,46,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.10);transition:opacity .45s ease;width:min(720px,calc(100vw - 32px));box-sizing:border-box;z-index:5}
.bar.hide{opacity:0;pointer-events:none}
.bar button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);
  color:#f4f1ea;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.bar button:hover{background:rgba(226,191,124,.16);border-color:rgba(226,191,124,.45)}
.bar input[type=range]{flex:1;accent-color:#e2bf7c;min-width:0;cursor:pointer}
.bar .time{font-size:12px;font-variant-numeric:tabular-nums;color:rgba(244,241,234,.7);min-width:78px;text-align:right}
#hint{position:fixed;top:18px;left:0;right:0;text-align:center;font-size:13px;color:rgba(244,241,234,.6);display:none}
@media (orientation:portrait){#hint{display:block}}
</style>
</head>
<body>
<div id="hint">Za najbolji prikaz okrenite telefon</div>
<div id="wrap"><canvas id="cv" aria-label="Animacija: kako funkcioniše StayVB"></canvas></div>
<div class="bar" id="bar">
  <button id="b-play" aria-label="Pusti ili pauziraj"></button>
  <button id="b-restart" aria-label="Od početka"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  <input type="range" id="seek" min="0" max="75.5" step="0.01" value="0" aria-label="Vreme">
  <span class="time" id="time">0:00 / 1:15</span>
  <button id="b-full" aria-label="Ceo ekran"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   StayVB — animacija od 45 sekundi. Sve se crta na platnu iz jedne
   funkcije render(t), pa pauza i premotavanje rade u svakom trenutku.
   Parametri: ?t=12 (početak), ?pause=1, ?loop=1 (za ekrane u holu)
   ═══════════════════════════════════════════════════════════════════ */
const W = 1600, H = 900, DUR = 75.5;
/* Vremenska mapa: prava sekunda -> sekunda koreografije. Delovi u kojima
   publika čita teče sporije, pa tekst ostaje duže na ekranu. */
const WARP = [
  [0, 0], [4.5, 3.8], [7.5, 4.8], [8.3, 5.6],                // uvod
  [13.0, 9.7], [16.5, 11.0], [17.1, 11.6],                     // problem
  [22.6, 17.3], [25.6, 17.6], [26.2, 18.2],                    // jedan sken
  [33.5, 25.2], [34.3, 25.7], [38.3, 28.0], [39.4, 29.4],      // mreža
  [44.5, 34.2], [49.5, 37.6], [50.1, 38.2],                    // svi zarađuju
  [56.5, 42.6], [61.0, 44.6], [61.6, 45.2],                    // rast zarade
  [66.5, 48.9], [69.0, 49.4], [69.5, 49.9],                    // ostanite večeras
  [72.5, 51.5], [75.5, 52.0],                                  // kraj
];
function warp(t) {
  for (let i = 1; i < WARP.length; i++) {
    const [n1, o1] = WARP[i - 1], [n2, o2] = WARP[i];
    if (t <= n2) return o1 + (o2 - o1) * ((t - n1) / (n2 - n1));
  }
  return WARP[WARP.length - 1][1];
}
const ON = '#f4f1ea', ON2 = 'rgba(244,241,234,0.68)', GOLD = '#e2bf7c', GOLD_D = '#b4873b';
const TERRA = '#e8946c', SAGE = '#7cc4a6', CREAM = '#d6dde6';
const TYPE = {
  H: { col: GOLD,  label: 'Hoteli i apartmani' },
  R: { col: TERRA, label: 'Restorani i kafići' },
  A: { col: SAGE,  label: 'Atrakcije' },
  E: { col: CREAM, label: 'Događaji' },
};

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;

// ── Pomoćne funkcije ───────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eback = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const frac = x => x - Math.floor(x);
function vis(t, a, b, fi = .6, fo = .6) {
  if (t < a || t > b) return 0;
  return Math.min(eo(seg(t, a, a + fi)), 1 - eo(seg(t, b - fo, b)));
}
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r;
    return ((r ^ r >>> 14) >>> 0) / 4294967296;
  };
}
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h1, h2, k) {
  const a = hex2rgb(h1), b = hex2rgb(h2);
  return `rgb(${Math.round(lerp(a[0], b[0], k))},${Math.round(lerp(a[1], b[1], k))},${Math.round(lerp(a[2], b[2], k))})`;
}
function rgba(h, a) { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function font(size, serif, weight) {
  return `${weight || (serif ? 600 : 500)} ${size}px ${serif ? "'Playfair Display', Georgia, serif" : "'Plus Jakarta Sans', system-ui, sans-serif"}`;
}
function txt(s, x, y, o = {}) {
  const { size = 32, serif = false, weight, color = ON, align = 'left', a = 1, ls = 0, base = 'alphabetic' } = o;
  if (a <= 0.001) return;
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.font = font(size, serif, weight);
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = base;
  if ('letterSpacing' in ctx) ctx.letterSpacing = ls + 'px';
  ctx.fillText(s, x, y);
  ctx.restore();
}
function wrapLines(s, maxW, size, serif, weight) {
  ctx.save();
  ctx.font = font(size, serif, weight);
  const words = s.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  ctx.restore();
  return lines;
}
function glowDot(x, y, r, col, a = 1, blur = 18) {
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.shadowColor = col; ctx.shadowBlur = blur;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function coin(x, y, r, a = 1) {
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha *= a;
  const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
  g.addColorStop(0, '#fbe7a6'); g.addColorStop(.55, '#e2bf7c'); g.addColorStop(1, '#a87722');
  ctx.shadowColor = 'rgba(226,191,124,.7)'; ctx.shadowBlur = r * 1.2;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(122,84,24,.75)'; ctx.lineWidth = Math.max(1, r * .12);
  ctx.beginPath(); ctx.arc(x, y, r * .68, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// ── Krive i grafici ────────────────────────────────────────────────
function mkCurve(f, x0, x1, yBase, yTop, n = 28) {
  return Array.from({ length: n }, (_, i) => { const u = i / (n - 1); return [lerp(x0, x1, u), yBase - f(u) * (yBase - yTop)]; });
}
function curvePath(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) {
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
  }
  const l = pts[pts.length - 1]; ctx.lineTo(l[0], l[1]);
}
function yAt(pts, x) {
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) {
    const k = (x - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]);
    return [x, lerp(pts[i - 1][1], pts[i][1], k)];
  }
  return pts[pts.length - 1];
}
// crta krivu do udela k (0–1) sa svetlom ispunom ispod; vraća tačku na vrhu
function drawCurve(pts, k, col, o = {}) {
  const { width = 3, fill = true, base = H, glow = true } = o;
  const x0 = pts[0][0], x1 = pts[pts.length - 1][0], xc = x0 + (x1 - x0) * clamp(k);
  if (k <= 0) return [x0, pts[0][1]];
  ctx.save();
  ctx.beginPath(); ctx.rect(x0 - 30, -10, xc - x0 + 30, H + 20); ctx.clip();
  if (fill) {
    curvePath(pts); ctx.lineTo(x1, base); ctx.lineTo(x0, base); ctx.closePath();
    const top = Math.min(...pts.map(p => p[1]));
    const g = ctx.createLinearGradient(0, top, 0, base);
    g.addColorStop(0, rgba(col, .26)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.fill();
  }
  curvePath(pts);
  ctx.strokeStyle = col; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (glow) { ctx.shadowColor = col; ctx.shadowBlur = 12; }
  ctx.stroke();
  ctx.restore();
  return yAt(pts, xc);
}
function pill(s, x, y, col, a = 1, align = 'left') {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.font = font(14, false, 700);
  const w = ctx.measureText(s).width + 24, xx = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  rr(xx, y - 15, w, 30, 15); ctx.fillStyle = rgba(col, .14); ctx.fill();
  ctx.strokeStyle = rgba(col, .5); ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();
  txt(s, xx + w / 2, y + 5, { size: 14, weight: 700, color: col, align: 'center', a });
}

// ── Ikonice (crtane linijom, centrirane) ────────────────────────────
function iconHotel(x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = s * .07; ctx.lineJoin = 'round';
  rr(-s * .42, -s * .5, s * .84, s, s * .06); ctx.stroke();
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
    ctx.fillRect(-s * .27 + i * s * .2 - s * .05, -s * .36 + j * s * .2, s * .1, s * .1);
  ctx.fillRect(-s * .08, s * .26, s * .16, s * .24);
  ctx.beginPath(); ctx.moveTo(-s * .5, -s * .5); ctx.lineTo(s * .5, -s * .5); ctx.stroke();
  ctx.restore();
}
function iconFood(x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = col; ctx.lineWidth = s * .07; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, s * .36, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = s * .04;
  ctx.beginPath(); ctx.arc(0, 0, s * .22, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = s * .06;
  ctx.beginPath(); ctx.moveTo(-s * .6, -s * .42); ctx.lineTo(-s * .6, s * .42); ctx.stroke();
  for (const dx of [-.68, -.52]) { ctx.beginPath(); ctx.moveTo(s * dx, -s * .42); ctx.lineTo(s * dx, -s * .16); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(s * .6, -s * .42); ctx.quadraticCurveTo(s * .74, -s * .1, s * .6, s * .02); ctx.lineTo(s * .6, s * .42); ctx.stroke();
  ctx.restore();
}
function iconWheel(x, y, s, col, rot = 0) {
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = s * .06; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-s * .32, s * .55); ctx.moveTo(0, 0); ctx.lineTo(s * .32, s * .55); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, s * .42, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = rot + i * Math.PI / 4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * s * .42, Math.sin(a) * s * .42); ctx.stroke();
    ctx.beginPath(); ctx.arc(Math.cos(a) * s * .42, Math.sin(a) * s * .42, s * .07, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function iconSpark(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const r = i % 2 ? s * .14 : s * .5, a = i * Math.PI / 4 - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function iconStay(x, y, s, col) {
  iconHotel(x - s * .2, y, s * .78, col);
  iconHouse(x + s * .36, y + s * .16, s * .5, col, 0);
}
function iconGuest(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = s * .08;
  ctx.beginPath(); ctx.arc(0, -s * .2, s * .17, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, s * .42, s * .34, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  ctx.restore();
}
function iconHouse(x, y, s, col, light) {
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = col; ctx.lineWidth = s * .06; ctx.lineJoin = 'round';
  ctx.fillStyle = '#0d151c';
  ctx.beginPath(); ctx.moveTo(-s * .55, -s * .05); ctx.lineTo(0, -s * .55); ctx.lineTo(s * .55, -s * .05);
  ctx.lineTo(s * .45, -s * .05); ctx.lineTo(s * .45, s * .5); ctx.lineTo(-s * .45, s * .5); ctx.lineTo(-s * .45, -s * .05); ctx.closePath();
  ctx.fill(); ctx.stroke();
  if (light > 0) {
    ctx.save(); ctx.globalAlpha *= light; ctx.shadowColor = '#f6c98a'; ctx.shadowBlur = 40 * light;
    ctx.fillStyle = '#f6d495';
    ctx.fillRect(-s * .28, s * .02, s * .22, s * .2); ctx.fillRect(s * .06, s * .02, s * .22, s * .2);
    ctx.restore();
  }
  ctx.restore();
}
function typeIcon(type, x, y, s, col, t = 0) {
  if (type === 'H') iconHotel(x, y, s, col);
  else if (type === 'R') iconFood(x, y, s, col);
  else if (type === 'A') iconWheel(x, y, s, col, t * .6);
  else iconSpark(x, y, s * 1.1, col);
}

// ── Pozadina ───────────────────────────────────────────────────────
const P = (() => { const r = rng(7); return Array.from({ length: 90 }, () => ({ x: r() * W, y: r() * H, r: .6 + r() * 1.7, s: .2 + r() * .7, ph: r() * 6.28 })); })();
function background(t) {
  const g = ctx.createLinearGradient(0, 0, W * .45, H);
  g.addColorStop(0, '#15202b'); g.addColorStop(.6, '#1b2935'); g.addColorStop(1, '#203140');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const gx = W * .84 + Math.sin(t * .15) * 70, gy = -80 + Math.cos(t * .11) * 30;
  const rg = ctx.createRadialGradient(gx, gy, 0, gx, gy, 950);
  rg.addColorStop(0, 'rgba(226,191,124,0.17)'); rg.addColorStop(1, 'rgba(226,191,124,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  for (const p of P) {
    const y = ((p.y - t * 9 * p.s) % H + H) % H;
    const a = .12 + .22 * (.5 + .5 * Math.sin(t * p.s * 1.4 + p.ph));
    ctx.fillStyle = `rgba(244,241,234,${a})`;
    ctx.beginPath(); ctx.arc(p.x + Math.sin(t * .3 + p.ph) * 6, y, p.r, 0, Math.PI * 2); ctx.fill();
  }
}

// ═══════════════════════════════════════════════════════════════════
// SCENA 1 · 0–5,6 s · Uvod
// ═══════════════════════════════════════════════════════════════════
const CITY = (() => {
  const r = rng(3), pts = [];
  while (pts.length < 26) {
    const a = r() * Math.PI * 2, d = 200 + r() * 520;
    const p = { x: 800 + Math.cos(a) * d * 1.15, y: 450 + Math.sin(a) * d * .55, d: r() };
    if (Math.abs(p.x - 800) < 420 && Math.abs(p.y - 470) < 170) continue;
    pts.push(p);
  }
  return pts;
})();
function scene1(t) {
  const a = vis(t, 0, 5.6, .8, .7);
  if (!a) return;
  ctx.save(); ctx.globalAlpha = a;
  CITY.forEach((p, i) => {
    const k = eo(seg(t, .2 + i * .05, .8 + i * .05));
    CITY.forEach((q, j) => {
      if (j <= i) return;
      const d = Math.hypot(p.x - q.x, p.y - q.y);
      if (d < 230) {
        ctx.strokeStyle = `rgba(226,191,124,${.12 * k * eo(seg(t, 1.2, 2.4))})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      }
    });
    glowDot(p.x, p.y, 3.5 * k, GOLD, k * (.5 + .5 * Math.sin(t * 2 + i)), 14);
  });
  const k1 = eo(seg(t, .9, 1.8));
  txt('StayVB', 800, 440 + (1 - k1) * 30, { size: 150, serif: true, align: 'center', a: k1, ls: -2 });
  const k2 = eo(seg(t, 1.6, 2.5));
  ctx.strokeStyle = GOLD; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(800 - 170 * k2, 482); ctx.lineTo(800 + 170 * k2, 482); ctx.stroke();
  const k3 = eo(seg(t, 1.9, 2.7));
  txt('Digitalni sistem destinacije  ·  Vrnjačka Banja', 800, 536 + (1 - k3) * 16, { size: 26, align: 'center', color: ON2, a: k3, ls: .5 });
  const k4 = eo(seg(t, 2.9, 3.7));
  txt('Jedan grad. Jedna mreža.', 800, 620 + (1 - k4) * 18, { size: 46, serif: true, align: 'center', color: GOLD, a: k4 });
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════
// SCENA 2 · 5,6–11,6 s · Problem: gost troši, hotel ne zarađuje
// ═══════════════════════════════════════════════════════════════════
const S2 = {
  places: [
    { type: 'S', x: 250, y: 610, label: 'Hotel ili apartman' },
    { type: 'R', x: 700, y: 450, label: 'Restoran' },
    { type: 'A', x: 1040, y: 650, label: 'Atrakcija' },
    { type: 'E', x: 1370, y: 450, label: 'Događaj' },
  ],
  legs: [{ a: 6.6, b: 7.5 }, { a: 8.0, b: 8.8 }, { a: 9.3, b: 10.1 }],
};
function guestPos2(t) {
  const pl = S2.places;
  for (let i = 0; i < 3; i++) {
    const L = S2.legs[i];
    if (t < L.a) return i === 0 ? { x: pl[0].x + 60, y: pl[0].y + 20 } : { x: pl[i].x + 60, y: pl[i].y + 20 };
    if (t <= L.b) {
      const k = eio(seg(t, L.a, L.b));

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight') { t = Math.min(DUR, t + 3); poke(); }
  else if (e.code === 'ArrowLeft') { t = Math.max(0, t - 3); poke(); }
});

bPlay.innerHTML = ICON_PLAY;
const fontsReady = Promise.race([
  Promise.all([
    document.fonts.load("600 40px 'Playfair Display'"), document.fonts.load("500 20px 'Plus Jakarta Sans'"),
    document.fonts.load("600 20px 'Plus Jakarta Sans'"), document.fonts.load("700 20px 'Plus Jakarta Sans'"),
  ]),
  new Promise(r => setTimeout(r, 2500)),
]);
fontsReady.then(() => {
  requestAnimationFrame(frame);
  if (qs.get('pause') !== '1') setPlaying(true);
});
</script>
