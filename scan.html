<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>StayVB — Skener</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#05070e;color:white;min-height:100vh;margin:0}
.wrap{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}
#msg-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.08)}
.header span{font-size:13px;font-weight:900;color:white}
</style>
</head>
<body>

<div id="msg-screen">
  <p style="font-size:2.5rem;margin-bottom:8px">⏳</p>
  <p id="msg-text" style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.5)">Proveravam link...</p>
</div>

<div id="scanner-wrap" class="wrap hidden">
  <div class="header">
    <span>📷 <span id="scanner-partner-name"></span></span>
  </div>
  <div id="qr-reader" style="width:100%;max-width:430px;margin:0 auto"></div>
  <div id="scan-result" style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center"></div>
</div>

<script>
const sb = C.db();
const scannerToken = new URLSearchParams(window.location.search).get('s') || '';
let partnerId = null;

function esc(s){ return C.escapeHtml(s); }

async function init(){
  const msgEl = document.getElementById('msg-text');
  if(!scannerToken){ msgEl.textContent = 'Nevažeći link.'; return; }

  const { data, error } = await sb.rpc('scanner_login', { p_scanner_token: scannerToken });
  if(error) console.error('scanner_login:', error);
  if(error || !data || data.length === 0){
    document.getElementById('msg-screen').querySelector('p').textContent = '⚠️';
    msgEl.textContent = 'Nevažeći ili istekao link. Zatraži nov link od vlasnika.' + (error ? (' (' + error.message + ')') : '');
    return;
  }

  partnerId = data[0].id;
  document.getElementById('scanner-partner-name').textContent = data[0].name;
  document.getElementById('msg-screen').classList.add('hidden');
  document.getElementById('scanner-wrap').classList.remove('hidden');
  openScanner();
}

// ── Skener za realizaciju rezervacije ──────────────────────────────
// Gost dobije QR kod ("STAYVB:<booking_id>") posle rezervacije u
// atrakcije.html. Ovde se skenira kad gost dođe/plati — to postavlja
// bookings.redeemed_at, a baza (triger) sama upisuje proviziju
// apartmanu ako uslovi budu ispunjeni.
let qrScanner = null;

function openScanner(){
  qrScanner = new Html5Qrcode('qr-reader');
  qrScanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 230 },
    onScanDecoded,
    () => {}
  ).catch(() => {
    document.getElementById('scan-result').innerHTML = '<p style="color:#fca5a5;font-weight:800;font-size:13px">Nije moguće pristupiti kameri. Proveri dozvole browsera.</p>';
  });
}

let scanLock = false;
async function onScanDecoded(decodedText){
  if(scanLock) return;
  const m = /^STAYVB:([0-9a-f-]{20,})$/i.exec((decodedText || '').trim());
  if(!m) return; // nije naš kod, nastavi skeniranje

  scanLock = true;
  if(qrScanner) qrScanner.pause(true);
  const bookingId = m[1];
  const resultEl = document.getElementById('scan-result');
  resultEl.innerHTML = '<p style="color:rgba(255,255,255,0.5);font-weight:700;font-size:13px">Provera...</p>';

  try{
    const { data:booking, error } = await sb.from('bookings')
      .select('id, status, redeemed_at, guest_name, resource_id, bookable_resources(name, partner_id)')
      .eq('id', bookingId).maybeSingle();

    if(error || !booking){
      resultEl.innerHTML = '<p style="color:#fca5a5;font-weight:900;font-size:14px">⚠️ Kod nije prepoznat.</p>';
    } else if(booking.bookable_resources?.partner_id !== partnerId){
      resultEl.innerHTML = '<p style="color:#fca5a5;font-weight:900;font-size:14px">⚠️ Ova rezervacija ne pripada ovom biznisu.</p>';
    } else if(booking.status === 'cancelled'){
      resultEl.innerHTML = '<p style="color:#fca5a5;font-weight:900;font-size:14px">⚠️ Rezervacija je otkazana.</p>';
    } else if(booking.redeemed_at){
      resultEl.innerHTML = `<p style="color:#fcd34d;font-weight:900;font-size:14px">⚠️ Kod je već iskorišćen<br><span style="font-size:11px;font-weight:700">${new Date(booking.redeemed_at).toLocaleString('sr-RS')}</span></p>`;
    } else {
      const { error: updErr } = await sb.from('bookings').update({ redeemed_at: new Date().toISOString() }).eq('id', bookingId);
      if(updErr){
        resultEl.innerHTML = '<p style="color:#fca5a5;font-weight:900;font-size:14px">⚠️ Greška, pokušaj ponovo.</p>';
      } else {
        resultEl.innerHTML = `<div><div style="font-size:2.5rem;margin-bottom:8px">✅</div><p style="color:#6ee7b7;font-weight:900;font-size:15px;margin:0 0 4px">${esc(booking.guest_name)}</p><p style="color:rgba(255,255,255,0.6);font-weight:700;font-size:12px">${esc(booking.bookable_resources?.name||'')} — realizovano</p></div>`;
      }
    }
  } catch(e){
    resultEl.innerHTML = '<p style="color:#fca5a5;font-weight:900;font-size:14px">⚠️ Greška, pokušaj ponovo.</p>';
  }

  setTimeout(() => {
    scanLock = false;
    if(qrScanner){ try{ qrScanner.resume(); }catch(e){} }
    resultEl.innerHTML = '';
  }, 2500);
}

init();
</script>
</body>
</html>
