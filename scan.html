<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>StayVB — Skener</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#05070e;color:white;min-height:100vh;margin:0}
.wrap{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}
#msg-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.08)}
.header span{font-size:13px;font-weight:900;color:white}
</style>
</head>
<body>

<div id="msg-screen">
  <p style="font-size:2.5rem;margin-bottom:8px">⏳</p>
  <p id="msg-text" style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.5)">Proveravam link...</p>
</div>

<div id="scanner-wrap" class="wrap hidden">
  <div class="header">
    <span>📷 <span id="scanner-partner-name"></span></span>
  </div>
  <div id="qr-reader" style="width:100%;max-width:430px;margin:0 auto"></div>
  <div id="scan-result" style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center"></div>
</div>

<script>
const sb = C.db();
const scannerToken = new URLSearchParams(window.location.search).get('s') || '';

function esc(s){ return C.escapeHtml(s); }

async function init(){
  const msgEl = document.getElementById('msg-text');
  if(!scannerToken){ msgEl.textContent = 'Nevažeći link.'; return; }

  const { data, error } = await sb.rpc('scanner_login', { p_scanner_token: scannerToken });
  if(error) console.error('scanner_login:', error);
  if(error || !data || data.length === 0){
    document.getElementById('msg-screen').querySelector('p').textContent = '⚠️';
    msgEl.textContent = 'Nevažeći ili istekao link. Zatraži nov link od vlasnika.' + (error ? (' (' + error.message + ')') : '');
    return;
  }

  document.getElementById('scanner-partner-name').textContent = data[0].name;
  document.getElementById('msg-screen').classList.add('hidden');
  document.getElementById('scanner-wrap').classList.remove('hidden');
  openScanner();
}

// ── Skener za realizaciju rezervacije ──────────────────────────────
// Gost dobije QR kod ("STAYVB:<booking_id>") posle rezervacije u
// atrakcije.html. Ovde se skenira kad gost dođe/plati — to postavlja
// bookings.redeemed_at, a baza (triger) sama upisuje proviziju
// apartmanu ako uslovi budu ispunjeni.
let qrScanner = null;

function openScanner(){
  qrScanner = new Html5Qrcode('qr-reader');
  qrScanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 230 },
    onScanDecoded,
    () => {}
  ).catch(() => {
    document.getElementById('scan-result').innerHTML = '<p style="color:#fca5a5;font-weight:800;font-size:13px">Nije moguće pristupiti kameri. Proveri dozvole browsera.</p>';
  });
}

let scanLock = false;
let currentBookingId = null;

const rsd = n => (Number(n) || 0).toLocaleString('sr-RS') + ' RSD';
const row = (label, value) => `<div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08)">
  <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.4)">${label}</div>
  <div style="font-size:14px;font-weight:800;color:white;margin-top:3px">${value}</div></div>`;

function scanCardHtml(d){
  return `<div style="width:100%;max-width:400px;text-align:left">
    <div style="font-size:20px;font-weight:900;color:white;margin-bottom:4px">${esc(d.guest_name)}</div>
    <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.5);margin-bottom:12px">${esc(d.booking_date)} u ${esc(d.slot_time)} · ${d.qty} ${d.qty===1?'osoba':'osoba'}</div>
    ${row('Odakle gost dolazi', d.accommodation_name ? esc(d.accommodation_name) : '—')}
    ${row('Šta rezervacija obuhvata', esc(d.resource_name) + (d.description ? '<div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.7);margin-top:4px;line-height:1.5">' + esc(d.description) + '</div>' : ''))}
    ${row('Cena', `${rsd(d.unit_price)} × ${d.qty} = <span style="color:#fcd34d">${rsd(d.total)}</span>`)}
  </div>`;
}

function showScanOutcome(html){
  document.getElementById('scan-result').innerHTML = html;
}

async function onScanDecoded(decodedText){
  if(scanLock) return;
  const m = /^STAYVB:([0-9a-f-]{20,})$/i.exec((decodedText || '').trim());
  if(!m) return; // nije naš kod, nastavi skeniranje

  scanLock = true;
  if(qrScanner) qrScanner.pause(true);
  currentBookingId = m[1];
  showScanOutcome('<p style="color:rgba(255,255,255,0.5);font-weight:700;font-size:13px">Učitavam rezervaciju...</p>');

  const { data, error } = await sb.rpc('booking_preview', { p_scanner_token: scannerToken, p_booking_id: currentBookingId });
  const d = Array.isArray(data) ? data[0] : null;

  if(error || !d){
    showScanOutcome(`<p style="color:#fca5a5;font-weight:900;font-size:14px">⚠️ Greška, pokušaj ponovo.</p>${closeBtn()}`);
    return;
  }
  if(!d.ok){
    showScanOutcome(`<p style="color:#fcd34d;font-weight:900;font-size:14px">⚠️ ${esc(d.msg)}</p>${closeBtn()}`);
    return;
  }

  showScanOutcome(`${scanCardHtml(d)}
    <div style="display:flex;gap:10px;margin-top:18px;width:100%;max-width:400px">
      <button onclick="realizeCurrent()" style="flex:1;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#059669,#10b981);color:white;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit">✅ Realizuj</button>
      <button onclick="closeScanResult()" style="padding:16px 18px;border-radius:14px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.7);font-weight:900;font-size:13px;cursor:pointer;font-family:inherit">Odustani</button>
    </div>`);
}

function closeBtn(){
  return `<button onclick="closeScanResult()" style="margin-top:18px;padding:14px 26px;border-radius:14px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:white;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit">Zatvori</button>`;
}

async function realizeCurrent(){
  if(!currentBookingId) return;
  showScanOutcome('<p style="color:rgba(255,255,255,0.5);font-weight:700;font-size:13px">Realizujem...</p>');
  const { data, error } = await sb.rpc('redeem_booking', { p_scanner_token: scannerToken, p_booking_id: currentBookingId });
  const r = Array.isArray(data) ? data[0] : null;
  if(error || !r){
    showScanOutcome(`<p style="color:#fca5a5;font-weight:900;font-size:14px">⚠️ Greška, pokušaj ponovo.</p>${closeBtn()}`);
    return;
  }
  if(!r.ok){
    showScanOutcome(`<p style="color:#fcd34d;font-weight:900;font-size:14px">⚠️ ${esc(r.msg)}</p>${closeBtn()}`);
    return;
  }
  showScanOutcome(`<div style="text-align:center"><div style="font-size:2.5rem;margin-bottom:8px">✅</div>
    <p style="color:#6ee7b7;font-weight:900;font-size:16px;margin:0 0 4px">${esc(r.guest_name)}</p>
    <p style="color:rgba(255,255,255,0.6);font-weight:700;font-size:12px">${esc(r.resource_name||'')} — realizovano</p>${closeBtn()}</div>`);
}

function closeScanResult(){
  currentBookingId = null;
  document.getElementById('scan-result').innerHTML = '';
  scanLock = false;
  if(qrScanner){ try{ qrScanner.resume(); }catch(e){} }
}

init();
</script>
</body>
</html>
